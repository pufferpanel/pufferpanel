name: Run Tool - Tester
on:
  repository_dispatch:
    types:
      - template-tester

env:
  TAG: templatetester
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  run-tester:
    name: Run Tool
    runs-on: template-tester
    permissions:
      packages: read

    strategy:
      matrix:
        template: ${{ github.event.client_payload.templates }}
      fail-fast: false

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          docker rm -f templatetester-${{ matrix.template }} || true
          docker volume rm -rf template-tester-${{ matrix.template }} || true
          echo "::add-mask::${{ secrets.RUNNER_IP }}"

      - name: Run
        run: |
          docker volume create template-tester-${{ matrix.template }}
          mountPath=$(docker volume inspect -f {{.Mountpoint}} template-tester-${{ matrix.template }})
          docker run --rm \
                 --name templatetester-${{ matrix.template }} \
                 -v template-tester-${{ matrix.template }}:/tester \
                 -v /var/run/docker.sock:/var/run/docker.sock \
                 -e PUFFER_DOCKER_ROOT=$mountPath \
                 --user $(id -u):$(id -g) \
                 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} --workDir=/tester --files=${{ matrix.template }}
          docker volume rm -rf template-tester-${{ matrix.template }}